<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura | Portal Redação Nota 1000</title>

    <!-- Global Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        accent: '#10B981',
                        canvas: '#F8FAFC',
                        deep: '#0F172A',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Local Data -->
    <script src="../dados/banco_redacoes.js"></script>
    <script src="../dados/banco_temas.js"></script>
    <script src="../dados/banco_repertorios.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .text-essay {
            line-height: 2;
            text-align: justify;
            font-size: 1.125rem;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-[100] px-4 py-3 glass-nav">
        <nav class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="biblioteca.html"
                class="flex items-center gap-2 text-slate-500 hover:text-primary font-bold text-sm transition-all group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                Voltar à Biblioteca
            </a>

            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-inner">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <span class="text-lg font-extrabold tracking-tight text-deep">Redação<span
                        class="text-primary font-black italic">1000</span></span>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12" id="main-content">
        <!-- Loading -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-slate-400">
            <div class="w-12 h-12 border-4 border-slate-200 border-t-primary rounded-full animate-spin mb-4"></div>
            <p class="font-bold">Abrindo redação...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const mainContent = document.getElementById('main-content');

            const coresComp = {
                'C1': 'bg-blue-100 text-blue-700',
                'C2': 'bg-purple-100 text-purple-700',
                'C3': 'bg-red-100 text-red-700',
                'C4': 'bg-green-100 text-green-700',
                'C5': 'bg-orange-100 text-orange-700'
            };

            if (!id) {
                renderError("Nenhuma redação foi selecionada.");
                return;
            }

            function loadData() {
                if (window.BANCO_REDACOES) {
                    const reda = window.BANCO_REDACOES.find(r => r.id === id);
                    if (reda) renderRedacao(reda);
                    else renderError("Redação não encontrada no banco de dados.");
                } else {
                    fetch('../dados/banco_redacoes.json')
                        .then(res => res.json())
                        .then(data => {
                            const reda = data.find(r => r.id === id);
                            if (reda) renderRedacao(reda);
                            else renderError("Redação não encontrada.");
                        })
                        .catch(err => renderError("Erro de conexão com o banco de dados."));
                }
            }

            function renderError(msg) {
                mainContent.innerHTML = `
                    <div class="bg-white p-12 rounded-[2.5rem] border border-slate-200 text-center space-y-6">
                        <i data-lucide="alert-circle" class="w-16 h-16 text-red-500 mx-auto"></i>
                        <h2 class="text-2xl font-black text-deep">Algo deu errado</h2>
                        <p class="text-slate-500 font-medium">${msg}</p>
                        <a href="biblioteca.html" class="inline-block bg-primary text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-primary/20 hover:scale-105 transition-transform">Voltar para a Galeria</a>
                    </div>
                `;
                lucide.createIcons();
            }

            function renderRedacao(reda) {
                const dateObj = new Date(reda.data_publicacao);
                const dataFormatada = new Intl.DateTimeFormat('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj);

                // Find related theme
                const temaRelacionado = window.BANCO_TEMAS ? window.BANCO_TEMAS.find(t => {
                    const tituloReda = reda.titulo.toLowerCase().trim();
                    const tituloTema = t.titulo.toLowerCase().trim();

                    // Strict match or overlap
                    if (tituloReda === tituloTema || tituloReda.includes(tituloTema) || tituloTema.includes(tituloReda)) {
                        return true;
                    }

                    // Match by year and thematic axis for ENEM themes
                    if (reda.ano_enem && reda.ano_enem === t.ano_aplicacao && t.ano_aplicacao !== null) {
                        return reda.eixo_tematico === t.eixo_tematico;
                    }

                    return false;
                }) : null;

                // Find matching repertoires (max 2)
                const repsRelacionados = window.BANCO_REPERTORIOS ? window.BANCO_REPERTORIOS.filter(rep =>
                    rep.eixos.includes(reda.eixo_tematico)
                ).slice(0, 2) : [];

                const compsHtml = (reda.competencias_destaque || []).map(c => `
                    <div class="flex items-center gap-2 px-4 py-2 bg-white rounded-xl border border-slate-100 shadow-sm">
                        <span class="w-6 h-6 rounded-full ${coresComp[c] || 'bg-slate-100'} flex items-center justify-center text-[10px] font-black">${c}</span>
                        <span class="text-xs font-bold text-slate-600">Competência ${c.replace('C', '')}</span>
                    </div>
                `).join('');

                const textHtml = reda.texto_completo.map(par => `
                    <p class="text-essay text-slate-700 mb-8 indent-10">
                        ${par}
                    </p>
                `).join('');

                const repsHtml = repsRelacionados.map(rep => `
                    <a href="../repertorio/detalhes.html?id=${rep.id}" class="block p-6 bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-indigo-50 text-indigo-500 text-[9px] font-black px-2 py-1 rounded-full uppercase tracking-widest">${rep.categoria}</span>
                            <i data-lucide="book-marked" class="w-4 h-4 text-slate-300"></i>
                        </div>
                        <h4 class="font-black text-deep text-lg mb-1">${rep.titulo}</h4>
                        <p class="text-xs font-bold text-primary italic mb-3">#${rep.autor}</p>
                        <p class="text-xs text-slate-500 font-medium leading-relaxed">${rep.descricao}</p>
                    </a>
                `).join('');

                mainContent.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
                        <article class="lg:col-span-2 bg-white rounded-[3rem] shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
                            <div class="p-8 md:p-12 space-y-10">
                                <!-- Header -->
                                <header class="space-y-6">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="px-3 py-1 bg-accent/10 text-accent text-[10px] font-black rounded-full uppercase tracking-widest border border-accent/20">Nota 1000</span>
                                        <span class="px-3 py-1 bg-slate-100 text-slate-500 text-[10px] font-black rounded-full uppercase tracking-widest">ENEM ${reda.ano_enem}</span>
                                        <span class="px-3 py-1 bg-primary/10 text-primary text-[10px] font-black rounded-full uppercase tracking-widest">${reda.eixo_tematico}</span>
                                    </div>
                                    
                                    <h1 class="text-3xl md:text-4xl font-black text-deep leading-tight">${reda.titulo}</h1>
                                    
                                    <div class="flex items-center gap-6 pt-2 text-slate-400 font-bold text-xs uppercase tracking-widest">
                                        <div class="flex items-center gap-2">
                                            <i data-lucide="calendar" class="w-4 h-4 text-primary"></i>
                                            ${dataFormatada}
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <i data-lucide="eye" class="w-4 h-4 text-primary"></i>
                                            ${reda.visualizacoes.toLocaleString('pt-BR')} leituras
                                        </div>
                                    </div>
                                </header>

                                <!-- Analysis Info -->
                                <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100 space-y-4">
                                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Por que esta redação é excelente?</h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${compsHtml}
                                    </div>
                                </div>

                                <!-- Content -->
                                <div class="relative">
                                    <div class="relative z-10">
                                        ${textHtml}
                                    </div>
                                </div>
                            </div>

                            <!-- Footer Actions -->
                            <div class="bg-slate-900 px-8 py-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                                <button class="w-full sm:w-auto bg-primary text-white px-8 py-4 rounded-xl font-bold text-sm shadow-2xl shadow-primary/40 hover:scale-105 transition-transform flex items-center justify-center gap-3">
                                    <i data-lucide="award" class="w-5 h-5"></i>
                                    Comentários do Professor
                                </button>
                                <a href="../pratica/pratica.html?ref=${reda.id}" class="w-full sm:w-auto bg-white/10 text-white border border-white/20 px-8 py-4 rounded-xl font-bold text-sm hover:bg-white/20 transition-all flex items-center justify-center gap-3">
                                    <i data-lucide="pen-tool" class="w-5 h-5"></i>
                                    Praticar este Tema
                                </a>
                            </div>
                        </article>

                        <!-- Sidebar Content -->
                        <aside class="space-y-8">
                            ${temaRelacionado ? `
                            <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="map" class="w-4 h-4"></i> Contexto do Tema
                                </h3>
                                <p class="text-sm text-slate-600 font-medium leading-relaxed italic">
                                    "${temaRelacionado.descricao}"
                                </p>
                                <a href="../temas/temas.html?id=${temaRelacionado.id}" class="inline-flex items-center gap-2 text-xs font-black text-primary hover:gap-3 transition-all">
                                    Ver Proposta Completa
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </a>
                            </div>
                            ` : ''}

                            <div class="space-y-4">
                                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="lightbulb" class="w-4 h-4 text-yellow-500"></i> Repertório Estratégico
                                </h3>
                                <div class="space-y-4">
                                    ${repsHtml || '<p class="text-xs text-slate-400">Nenhum repertório específico cadastrado para este eixo.</p>'}
                                </div>
                                <a href="../repertorio/repertorio.html" class="block text-center py-3 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-200 transition-colors mt-6">
                                    Explorar Todos os Repertórios
                                </a>
                            </div>
                        </aside>
                    </div>
                `;
                lucide.createIcons();
            }

            loadData();
            lucide.createIcons();
        });
    </script>
</body>

</html>
