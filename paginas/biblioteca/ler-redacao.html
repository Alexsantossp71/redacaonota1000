<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Ler Redação | Nota 1000</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Lexend', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen pb-20">
    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 w-full bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-[1000px] mx-auto px-6 h-16 flex items-center justify-between">
            <a href="biblioteca.html"
                class="flex items-center gap-2 text-slate-500 hover:text-primary transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="font-bold text-sm hidden sm:inline">Voltar para Biblioteca</span>
            </a>
            <div class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined font-bold">menu_book</span>
                <span class="font-bold text-slate-900 dark:text-white">ENEM 1000</span>
            </div>
        </div>
    </header>

    <main class="max-w-[800px] mx-auto px-4 sm:px-6 py-12" id="main-content">
        <!-- Center Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-slate-400">
            <span class="material-symbols-outlined text-4xl animate-spin mb-4">refresh</span>
            <p class="font-medium animate-pulse">Carregando redação...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const mainContent = document.getElementById('main-content');
            const coresComp = {
                'C1': 'bg-blue-100 text-blue-700 border-blue-200',
                'C2': 'bg-purple-100 text-purple-700 border-purple-200',
                'C3': 'bg-red-100 text-red-700 border-red-200',
                'C4': 'bg-green-100 text-green-700 border-green-200',
                'C5': 'bg-orange-100 text-orange-700 border-orange-200'
            };

            if (!id) {
                renderError("ID da redação não fornecido.");
                return;
            }

            fetch('../dados/banco_redacoes.json')
                .then(res => res.json())
                .then(data => {
                    const reda = data.find(r => r.id === id);
                    if (reda) {
                        renderRedacao(reda);
                    } else {
                        renderError("Redação não encontrada na base de dados.");
                    }
                })
                .catch(err => {
                    console.error(err);
                    renderError("Falha ao se conectar com o servidor.");
                });

            function renderError(msg) {
                mainContent.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-6 rounded-xl border border-red-200 text-center">
                        <span class="material-symbols-outlined text-4xl mb-2">error</span>
                        <h2 class="text-lg font-bold">Ops! Algo deu errado.</h2>
                        <p>${msg}</p>
                        <a href="biblioteca.html" class="mt-4 inline-block px-6 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700">Voltar à Biblioteca</a>
                    </div>
                `;
            }

            function renderRedacao(reda) {
                // Formatar data
                const dateObj = new Date(reda.data_publicacao);
                const formatter = new Intl.DateTimeFormat('pt-BR', { year: 'numeric', month: 'long', day: 'numeric' });
                const dataFormatada = formatter.format(dateObj);

                // Competências Badges
                const compsHtml = reda.competencias_destaque.map(comp => `
                    <span class="px-3 py-1 rounded-full text-xs font-bold border ${coresComp[comp]} shadow-sm">
                        Competência ${comp.replace('C', '')}
                    </span>
                `).join('');

                // Parágrafos
                const textHtml = reda.texto_completo.map(par => `
                    <p class="text-lg text-slate-700 dark:text-slate-300 leading-loose indent-8 mb-6 text-justify">
                        ${par}
                    </p>
                `).join('');

                mainContent.innerHTML = `
                    <article class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 sm:p-12">
                        <!-- Header da Redação -->
                        <header class="border-b border-slate-100 dark:border-slate-800 pb-8 mb-8">
                            <div class="flex flex-wrap items-center gap-3 mb-6">
                                <span class="bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 text-xs font-black px-3 py-1 rounded-md uppercase tracking-widest flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[14px]">workspace_premium</span>
                                    Nota 1000
                                </span>
                                <span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-bold px-3 py-1 rounded-md uppercase tracking-wider">
                                    ENEM ${reda.ano_enem}
                                </span>
                                <span class="bg-primary/10 text-primary text-xs font-bold px-3 py-1 rounded-md uppercase tracking-wider">
                                    ${reda.eixo_tematico}
                                </span>
                            </div>
                            
                            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white leading-tight mb-4">
                                ${reda.titulo}
                            </h1>
                            
                            <div class="flex items-center gap-4 text-sm text-slate-500 font-medium">
                                <div class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                                    ${dataFormatada}
                                </div>
                                <div class="w-1 h-1 rounded-full bg-slate-300"></div>
                                <div class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[18px]">visibility</span>
                                    ${reda.visualizacoes.toLocaleString('pt-BR')} leituras
                                </div>
                            </div>
                        </header>

                        <!-- Highlights -->
                        <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl max-p-6 p-6 mb-10 border border-slate-100 dark:border-slate-800">
                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Pontos fortes desta redação</h3>
                            <div class="flex flex-wrap gap-2">
                                ${compsHtml}
                            </div>
                        </div>

                        <!-- Corpo do Texto -->
                        <div class="prose prose-slate dark:prose-invert max-w-none font-serif relative">
                            <!-- Marca d'água discreta -->
                            <div class="absolute inset-0 flex items-center justify-center opacity-[0.02] pointer-events-none select-none">
                                <span class="material-symbols-outlined text-[300px]">edit_document</span>
                            </div>
                            
                            ${textHtml}
                        </div>
                    </article>

                    <!-- Ações Pós-Leitura -->
                    <div class="mt-12 flex flex-col sm:flex-row items-center justify-center gap-4">
                        <button class="w-full sm:w-auto px-8 py-3 bg-primary text-white font-bold rounded-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
                            <span class="material-symbols-outlined">analytics</span>
                            Análise do Corretor
                        </button>
                        <button class="w-full sm:w-auto px-8 py-3 bg-white dark:bg-slate-800 text-slate-700 dark:text-white font-bold rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">history_edu</span>
                            Praticar este tema
                        </button>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
