<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertório Acadêmico | Portal Redação Nota 1000</title>

    <!-- Global Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        accent: '#10B981',
                        canvas: '#F8FAFC',
                        deep: '#0F172A',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Local Data -->
    <script src="../dados/banco_repertorios.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Mobile Menu */
        #mobile-menu {
            transition: all 0.3s ease-in-out;
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        #mobile-menu.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-[100] px-4 py-3 glass-nav">
        <nav class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="../../index.html" class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-inner">
                        <i data-lucide="book-open" class="w-6 h-6"></i>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight text-deep">Redação<span
                            class="text-primary font-black italic">1000</span></span>
                </a>
            </div>

            <ul class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <li><a href="../../index.html" class="hover:text-primary transition-colors">Início</a></li>
                <li><a href="../aulas/aulas.html" class="hover:text-primary transition-colors">Aulas</a></li>
                <li><a href="../temas/temas.html" class="hover:text-primary transition-colors">Temas</a></li>
                <li><a href="../biblioteca/biblioteca.html" class="hover:text-primary transition-colors">Biblioteca</a>
                </li>
                <li><a href="repertorio.html" class="text-primary font-bold border-b-2 border-primary">Repertório</a>
                </li>
            </ul>

            <div class="flex items-center gap-4">
                <button id="menu-toggle" class="md:hidden p-2 text-slate-600 hover:text-primary transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="hidden sm:block w-10 h-10 rounded-full bg-slate-200 border border-slate-300 overflow-hidden">
                    <img src="https://i.pravatar.cc/100?u=me" alt="User">
                </div>
            </div>
        </nav>

        <!-- Mobile Menu Overlay -->
        <div id="mobile-menu" class="md:hidden fixed top-24 left-4 right-4 bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-2xl border border-slate-100 p-8 z-[90]">
            <ul class="flex flex-col gap-6 text-lg font-bold text-slate-800">
                <li><a href="../../index.html" class="flex items-center gap-3 hover:text-primary transition-colors"><i data-lucide="home" class="w-5 h-5"></i> Início</a></li>
                <li><a href="../aulas/aulas.html" class="flex items-center gap-3 hover:text-primary transition-colors"><i data-lucide="monitor-play" class="w-5 h-5"></i> Aulas</a></li>
                <li><a href="../temas/temas.html" class="flex items-center gap-3 hover:text-primary transition-colors"><i data-lucide="flame" class="w-5 h-5"></i> Temas</a></li>
                <li><a href="../biblioteca/biblioteca.html" class="flex items-center gap-3 hover:text-primary transition-colors"><i data-lucide="library" class="w-5 h-5"></i> Biblioteca</a></li>
                <li><a href="repertorio.html" class="flex items-center gap-3 text-primary"><i data-lucide="database" class="w-5 h-5"></i> Repertório</a></li>
                <li><a href="../pratica/pratica.html" class="flex items-center gap-3 hover:text-primary transition-colors"><i data-lucide="pencil" class="w-5 h-5"></i> Prática</a></li>
            </ul>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="mb-12">
            <h1 class="text-4xl md:text-5xl font-black text-deep mb-4">Repertório Estratégico</h1>
            <p class="text-lg text-slate-500 font-medium max-w-2xl">Conceitos de sociologia, filosofia e história
                prontos para elevar o nível da sua argumentação.</p>
        </div>

        <!-- Filter Bar -->
        <div class="flex flex-wrap gap-3 mb-12" id="filtro-eixos">
            <button
                class="eixo-btn px-6 py-2.5 rounded-full bg-primary text-white font-bold text-sm shadow-lg shadow-primary/20 transition-all"
                data-eixo="Todos">Todos</button>
            <button
                class="eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all"
                data-eixo="Sociedade">Sociedade</button>
            <button
                class="eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all"
                data-eixo="Cidadania">Cidadania</button>
            <button
                class="eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all"
                data-eixo="Educação">Educação</button>
            <button
                class="eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all"
                data-eixo="Tecnologia">Tecnologia</button>
            <button
                class="eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all"
                data-eixo="Cultura">Cultura</button>
        </div>

        <!-- Repertoire Grid -->
        <div id="repertorio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will be rendered here -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('repertorio-grid');
            const botoes = document.querySelectorAll('.eixo-btn');

            // Check for URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const eixoInicial = urlParams.get('eixo') || 'Todos';

            function render(filtro = 'Todos') {
                grid.innerHTML = '';
                const filtrados = (filtro === 'Todos') ? BANCO_REPERTORIOS :
                    BANCO_REPERTORIOS.filter(r => r.eixos.includes(filtro));

                filtrados.forEach(rep => {
                    const card = document.createElement('a');
                    card.href = `detalhes.html?id=${rep.id}`;
                    card.className = "bg-white rounded-[2.5rem] p-8 border border-slate-200 hover:border-primary/50 hover:shadow-2xl hover:shadow-primary/5 transition-all flex flex-col justify-between group cursor-pointer";

                    card.innerHTML = `
                        <div class="space-y-6">
                            <div class="flex justify-between items-start">
                                <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
                                    <i data-lucide="scroll" class="w-6 h-6"></i>
                                </div>
                                <span class="bg-slate-100 text-slate-400 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">${rep.categoria}</span>
                            </div>
                            
                            <div>
                                <h3 class="text-2xl font-black text-deep mb-1">${rep.titulo}</h3>
                                <p class="text-sm font-bold text-primary italic mb-4">${rep.autor}</p>
                                <p class="text-sm text-slate-500 font-medium leading-relaxed">
                                    ${rep.descricao}
                                </p>
                            </div>

                            <div class="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100/50">
                                <h4 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                    <i data-lucide="lightbulb" class="w-3 h-3"></i> Aplicação na Redação:
                                </h4>
                                <p class="text-xs text-indigo-700 font-semibold leading-relaxed">
                                    ${rep.como_usar}
                                </p>
                            </div>
                        </div>

                        <div class="mt-8 flex flex-wrap gap-2">
                            ${rep.eixos.map(e => `<span class="px-2 py-1 bg-slate-50 text-slate-400 text-[9px] font-black rounded-lg uppercase tracking-tight">#${e}</span>`).join('')}
                        </div>
                    `;
                    grid.appendChild(card);
                });
                lucide.createIcons();
            }

            // Set initial button state
            botoes.forEach(btn => {
                if (btn.dataset.eixo === eixoInicial) {
                    btn.className = "eixo-btn px-6 py-2.5 rounded-full bg-primary text-white font-bold text-sm shadow-lg shadow-primary/20 transition-all";
                } else {
                    btn.className = "eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all";
                }
            });

            botoes.forEach(btn => {
                btn.addEventListener('click', () => {
                    botoes.forEach(b => {
                        b.className = "eixo-btn px-6 py-2.5 rounded-full bg-white text-slate-600 hover:bg-slate-100 font-bold text-sm transition-all";
                    });
                    btn.className = "eixo-btn px-6 py-2.5 rounded-full bg-primary text-white font-bold text-sm shadow-lg shadow-primary/20 transition-all";
                    render(btn.dataset.eixo);
                });
            });

            render(eixoInicial);
            lucide.createIcons();
        });

        // Mobile Menu Toggle
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            if (mobileMenu.classList.contains('active')) {
                icon.setAttribute('data-lucide', 'x');
            } else {
                icon.setAttribute('data-lucide', 'menu');
            }
            lucide.createIcons();
        });

        // Close menu on resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                mobileMenu.classList.remove('active');
            }
        });
    </script>
</body>

</html>
