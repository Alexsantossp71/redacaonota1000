<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Redação Nota 1000 | Atualizando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        deep: '#0F172A',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }

        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        @keyframes progress {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        .progress-bar-fill {
            animation: progress 10s linear forwards;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 antialiased">
    <div
        class="max-w-md w-full bg-white p-12 rounded-[2.5rem] shadow-2xl border border-slate-100 text-center space-y-8">
        <div class="flex justify-center">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    <path d="M22 2 11 13" />
                    <path d="m22 7-5-5-5 5" />
                </svg>
            </div>
        </div>

        <div class="space-y-4">
            <h1 class="text-2xl font-black text-deep font-display uppercase tracking-tight">Sincronizando Conteúdo</h1>
            <p id="update-text" class="text-slate-500 font-bold text-sm tracking-wide"></p>
        </div>

        <div class="space-y-3">
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-primary h-full progress-bar-fill"></div>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Aguarde 10 segundos para o
                redirecionamento</p>
        </div>

        <a href="index_original.html"
            class="inline-block text-primary text-xs font-black border-b-2 border-primary/20 hover:border-primary transition-all">Pular
            espera</a>
    </div>

    <script>
        // Formatar data e hora atual
        function updateTime() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const formatted = `Atualizados em ${day}/${month}/${year} às ${hours}:${minutes}`;
            document.getElementById('update-text').innerText = formatted;
        }

        updateTime();

        // Redirecionamento após 10 segundos
        setTimeout(() => {
            window.location.href = "index_original.html";
        }, 10000);
    </script>
</body>

</html>
